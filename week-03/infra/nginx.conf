events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream items-svc-s01 {
        server items-service:8000 max_fails=3 fail_timeout=30s;
    }

    upstream other-svc {
        server other-service:8000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            return 200 '{"service":"Waluigi API Gateway","status":"running","endpoints":{"/api/items":"Items Service","/api/other":"Other Service"}}';
            add_header Content-Type application/json;
        }

        location /health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"Waluigi"}';
            add_header Content-Type application/json;
        }

        location /api/tickets/ {
            proxy_pass http://items-svc-s01/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-Service "items-service" always;
        }

        
        location /api/other/ {
            proxy_pass http://other-svc/api/other/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs/items {
            proxy_pass http://items-svc-s01/docs;
            proxy_set_header Host $host;
        }

        location /docs/other {
            proxy_pass http://other-svc/docs;
            proxy_set_header Host $host;
        }

        error_page 404 /404.json;
        location = /404.json {
            internal;
            return 404 '{"error":"Not Found","message":"ВА-ХА! Страница не найдена!"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            return 500 '{"error":"Server Error","message":"ВА-А-А! Что-то пошло не так!"}';
            add_header Content-Type application/json;
        }
    }
}