version: '3.8'

services:
  items-service:
    build: 
      context: .
      dockerfile: Dockerfile.items
    container_name: waluigi-items
    ports:
      - "8141:8000"
    restart: unless-stopped
    environment:
      - APP_NAME=Waluigi's Inventory Empire
      - SERVICE_TYPE=items
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - waluigi-network
    volumes:
      - items-logs:/app/logs

  other-service:
    build:
      context: .
      dockerfile: Dockerfile.other
    container_name: waluigi-other
    ports:
      - "8142:8000"
    restart: unless-stopped
    environment:
      - APP_NAME=Mushroom Library Other Service
      - SERVICE_TYPE=other
      - PORT=8000
      - PYTHONUNBUFFERED=1
    networks:
      - waluigi-network
    volumes:
      - other-logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: waluigi-gateway
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - waluigi-network
    depends_on:
      - items-service
      - other-service
    restart: unless-stopped

networks:
  waluigi-network:
    driver: bridge

volumes:
  items-logs:
  other-logs:
  nginx-logs: