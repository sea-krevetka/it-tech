apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-app
  namespace: default
  labels:
    app: items-app
    project: distrib_systems
    week: "12"
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: items-app
      component: api
  
  template:
    metadata:
      labels:
        app: items-app
        component: api
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      
      containers:
      - name: items-container
        image: items-svc-s01:latest
        imagePullPolicy: IfNotPresent
        
        # Порты контейнера
        ports:
        - name: http
          containerPort: 8181
          protocol: TCP
        
        # Переменные окружения
        env:
        - name: PORT
          value: "8181"
        - name: APP_NAME
          value: "items-app"
        - name: DEBUG
          value: "false"
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
          successThreshold: 1
        
        startupProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30
      
      # Node selector
      # nodeSelector:
      #   node-type: application
      
      # Tolerations
      # tolerations:
      # - key: node-role.kubernetes.io/master
      #   effect: NoSchedule