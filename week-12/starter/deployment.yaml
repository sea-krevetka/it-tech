apiVersion: apps/v1
kind: Deployment
metadata:
  name: items-app
  labels:
    app: items-app
    project_code: items-s01
spec:
  replicas: 3
  selector:
    matchLabels:
      app: items-app
  template:
    metadata:
      labels:
        app: items-app
        version: v1
    spec:
      containers:
      - name: items-container
        image: items-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        env:
        - name: APP_NAME
          value: "Items Service"
        - name: PORT
          value: "8181"