events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Основные настройки
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstream для основного сервиса
    upstream shipments_backend {
        server shipments-svc-s01:8210 max_fails=3 fail_timeout=30s;
    }

    # HTTP сервер
    server {
        listen 80;
        server_name localhost;

        # Корневой эндпоинт
        location / {
            return 200 '{"service":"Shipments Gateway","status":"running","project_code":"shipments-s01"}';
            add_header Content-Type application/json;
        }

        # Healthcheck
        location /health {
            access_log off;
            return 200 '{"status":"healthy","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # API маршруты
        location /api/ {
            proxy_pass http://shipments_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Статика (если нужна)
        location /static/ {
            alias /static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Обработка ошибок
        error_page 404 /404.json;
        location = /404.json {
            internal;
            return 404 '{"error":"Not Found","message":"Resource not found"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            return 500 '{"error":"Server Error","message":"Internal server error"}';
            add_header Content-Type application/json;
        }
    }
}